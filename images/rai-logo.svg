<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Orange leaves on top -->
  <ellipse cx="85" cy="25" rx="12" ry="18" fill="#F59E0B" transform="rotate(-30 85 25)"/>
  <ellipse cx="115" cy="25" rx="12" ry="18" fill="#FB923C" transform="rotate(30 115 25)"/>

  <!-- Robot head outline -->
  <rect x="50" y="50" width="100" height="90" rx="25" fill="#7DD3FC" stroke="#2C3E50" stroke-width="4"/>

  <!-- Circuit pattern details -->
  <circle cx="70" cy="70" r="3" fill="#2C3E50" opacity="0.3"/>
  <circle cx="130" cy="70" r="3" fill="#2C3E50" opacity="0.3"/>
  <line x1="70" y1="70" x2="90" y2="80" stroke="#2C3E50" stroke-width="1" opacity="0.3"/>
  <line x1="130" y1="70" x2="110" y2="80" stroke="#2C3E50" stroke-width="1" opacity="0.3"/>

  <!-- Headphone/ears -->
  <rect x="35" y="75" width="15" height="35" rx="8" fill="#2C3E50"/>
  <rect x="150" y="75" width="15" height="35" rx="8" fill="#FB923C"/>

  <!-- Eyes/visor area -->
  <rect x="65" y="75" width="70" height="25" rx="12" fill="#E0F2FE" stroke="#2C3E50" stroke-width="2"/>

  <!-- RAI text inside -->
  <text x="100" y="98" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2C3E50">RAI</text>

  <!-- Smile -->
  <path d="M 75 115 Q 100 125 125 115" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>

  <!-- RAI text below robot -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#2C3E50">RAI</text>
</svg>
