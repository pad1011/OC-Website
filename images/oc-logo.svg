<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Orange County Florida Logo -->

  <!-- "ORANGE" Text -->
  <text x="200" y="90" font-family="'Arial', 'Helvetica', sans-serif" font-size="58" font-weight="bold" fill="#0088B8" text-anchor="middle" letter-spacing="2">ORANGE</text>

  <!-- Orange Fruit -->
  <circle cx="200" cy="200" r="65" fill="#FF8C42"/>

  <!-- Orange highlight/shine -->
  <ellipse cx="180" cy="180" rx="25" ry="20" fill="#FFA55C" opacity="0.7"/>

  <!-- Green Leaves -->
  <!-- Left leaf -->
  <ellipse cx="175" cy="145" rx="18" ry="32" fill="#7CB342" transform="rotate(-35 175 145)"/>

  <!-- Right leaf -->
  <ellipse cx="225" cy="145" rx="18" ry="32" fill="#8BC34A" transform="rotate(35 225 145)"/>

  <!-- Center leaf -->
  <ellipse cx="200" cy="138" rx="15" ry="28" fill="#9CCC65"/>

  <!-- Small stem -->
  <rect x="198" y="135" width="4" height="10" fill="#6D4C41" rx="1"/>

  <!-- "COUNTY" Text -->
  <text x="200" y="310" font-family="'Arial', 'Helvetica', sans-serif" font-size="58" font-weight="bold" fill="#0088B8" text-anchor="middle" letter-spacing="2">COUNTY</text>

  <!-- "FLORIDA" Text -->
  <text x="200" y="355" font-family="'Arial', 'Helvetica', sans-serif" font-size="28" fill="#0088B8" text-anchor="middle" letter-spacing="1">FLORIDA</text>

  <!-- Underline under FLORIDA -->
  <line x1="120" y1="365" x2="280" y2="365" stroke="#0088B8" stroke-width="4"/>
</svg>
