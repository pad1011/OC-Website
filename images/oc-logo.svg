<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="transparent"/>

  <!-- Orbital rings -->
  <ellipse cx="150" cy="150" rx="110" ry="35" fill="none" stroke="#FF8C42" stroke-width="4" opacity="0.6"/>
  <ellipse cx="150" cy="150" rx="35" ry="110" fill="none" stroke="#1E8C8C" stroke-width="4" opacity="0.6"/>

  <!-- Orange fruit body -->
  <circle cx="150" cy="150" r="50" fill="url(#orangeGradient)"/>

  <!-- Orange texture dots -->
  <circle cx="130" cy="140" r="2" fill="#E67E22" opacity="0.5"/>
  <circle cx="140" cy="135" r="1.5" fill="#E67E22" opacity="0.5"/>
  <circle cx="160" cy="138" r="2" fill="#E67E22" opacity="0.5"/>
  <circle cx="170" cy="145" r="1.5" fill="#E67E22" opacity="0.5"/>
  <circle cx="145" cy="155" r="2" fill="#E67E22" opacity="0.5"/>
  <circle cx="158" cy="160" r="1.5" fill="#E67E22" opacity="0.5"/>
  <circle cx="135" cy="165" r="2" fill="#E67E22" opacity="0.5"/>

  <!-- Orange highlight -->
  <ellipse cx="135" cy="135" rx="18" ry="14" fill="white" opacity="0.4"/>

  <!-- White star on orange -->
  <polygon points="150,125 153,133 161,133 155,138 157,146 150,141 143,146 145,138 139,133 147,133" fill="white" opacity="0.8"/>

  <!-- Leaves -->
  <ellipse cx="145" cy="95" rx="14" ry="28" fill="#1E8C8C" transform="rotate(-20 145 95)"/>
  <ellipse cx="155" cy="95" rx="14" ry="28" fill="#1E8C8C" transform="rotate(20 155 95)"/>
  <ellipse cx="150" cy="92" rx="12" ry="25" fill="#2AA89F"/>

  <!-- Leaf veins -->
  <line x1="145" y1="80" x2="145" y2="110" stroke="#156666" stroke-width="1.5"/>
  <line x1="155" y1="80" x2="155" y2="110" stroke="#156666" stroke-width="1.5"/>
  <line x1="150" y1="75" x2="150" y2="107" stroke="#156666" stroke-width="1.5"/>

  <!-- Text: ORANGE COUNTY -->
  <text x="150" y="235" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1E8C8C" text-anchor="middle" letter-spacing="1">ORANGE COUNTY</text>

  <!-- Underline -->
  <line x1="25" y1="245" x2="275" y2="245" stroke="#1E8C8C" stroke-width="4"/>

  <!-- Text: FLORIDA -->
  <text x="150" y="275" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#FF8C42" text-anchor="middle" letter-spacing="3">FLORIDA</text>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA463;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FF8C42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
