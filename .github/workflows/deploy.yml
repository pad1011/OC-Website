name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/county-rebrand-chatbot-01NyrZCR817skWte3ZyjfjfY
      - claude/deploy-github-changes-018PihoKTnYMkF4AeuAjXpBZ
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
